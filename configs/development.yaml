# ============================================================
# RKGB — Development Configuration
# Overrides base.yaml for local development environments.
# ============================================================

application:
  env: development
  debug: true
  host: "0.0.0.0"
  port: 8000
  reload: true

logging:
  level: DEBUG
  format: console
  include_caller: true

neo4j:
  uri: "bolt://localhost:7687"
  auth:
    username: neo4j
    password: devpassword
  database: rkgb

storage:
  backend: local
  local:
    base_path: "./data/files"
    create_dirs: true

fastapi:
  docs:
    enabled: true
  middleware:
    enable_request_id: true
    enable_process_time_header: true

feature_flags:
  enable_cache: false   # Skip Redis in dev by default

monitoring:
  health:
    include_details: true
