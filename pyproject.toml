[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rkgb"
version = "0.1.0"
description = "Research Knowledge Graph Builder — Enterprise AI Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "RKGB Team" }]
keywords = ["knowledge-graph", "research", "ai", "nlp", "graph-rag"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Async support
    "anyio>=4.4.0",
    # Logging
    "structlog>=24.2.0",
    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    # Dependency injection
    "lagom>=2.5.0",
    # Utilities
    "tenacity>=8.3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "coverage[toml]>=7.5.0",
    "httpx>=0.27.0",
]
lint = [
    "ruff>=0.4.7",
    "black>=24.4.2",
    "isort>=5.13.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]
neo4j = [
    "neo4j>=5.21.0",
]
all = [
    "rkgb[dev,lint,neo4j]",
]

[project.scripts]
rkgb = "app.main:main"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "application",
    "domain",
    "infrastructure",
    "processing",
    "pipelines",
    "presentation",
    "shared",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "app",
    "application",
    "domain",
    "infrastructure",
    "processing",
    "pipelines",
    "presentation",
    "shared",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "N",   # pep8-naming
]
ignore = [
    "S101",    # assert-used (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "app",
    "application",
    "domain",
    "infrastructure",
    "processing",
    "pipelines",
    "presentation",
    "shared",
]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests (no I/O)",
    "integration: Integration tests (require external services)",
    "e2e: End-to-end tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = [
    "app",
    "application",
    "domain",
    "infrastructure",
    "processing",
    "pipelines",
    "presentation",
    "shared",
]
omit = ["*/tests/*", "*/conftest.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
